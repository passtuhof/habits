<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Привычки</title>
<style>
:root {
  --left-width: 25vw;
  --day-width: 33px;
  --row-height: 44px;
  --gap: 3px;
  --seven-days-width: calc(var(--day-width) * 7 + var(--gap) * 6);
}

* { box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  margin: 0;
  background: #fff;
  color: #111;
}

.app {
  padding: 14px;
  max-width: 620px;
  margin: 0 auto;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

h1 { margin: 0; font-size: 28px; }

button {
  border: none;
  background: #111;
  color: #fff;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 15px;
}

.empty-state {
  display: none;
  font-size: 16px;
  font-weight: 700;
  color: #777;
  padding: 20px 0;
}

.main-section-title {
  font-size: 16px;
  font-weight: 800;
  margin-top: 18px;
  margin-bottom: 10px;
}

.good-title-main {
  display: none;
  padding-bottom: 8px;
  border-bottom: 1px solid #eee;
}

.tracker {
  display: grid;
  grid-template-columns: var(--left-width) var(--seven-days-width);
  gap: 8px;
  overflow: hidden;
}

.corner {
  height: 24px;
  margin-bottom: 0;
}

.left-column {
  min-width: 0;
}

.category-left {
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  border-bottom: 1px solid #eee;
  font-size: 15px;
  font-weight: 400;
  touch-action: none;
}

.category-left.dragging,
.habit-left.dragging,
.bad-habit-row.dragging {
  transform: scale(1.035);
  background: rgba(0,0,0,0.05);
  border-radius: 10px;
  opacity: 0.8;
}

.category-title {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.category-arrow {
  font-size: 12px;
  flex-shrink: 0;
}

.category-spacer {
  height: 34px;
  border-bottom: 1px solid #eee;
}

.habit-left {
  height: var(--row-height);
  display: flex;
  align-items: center;
  border-bottom: 1px solid #eee;
  transition: transform 0.18s ease, background 0.18s ease, opacity 0.18s ease;
}

.name-wrap {
  min-width: 0;
  flex: 1;
  touch-action: none;
}

.habit-name {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.15;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  white-space: normal;
  overflow: hidden;
  text-overflow: ellipsis;
}

.right-scroll {
  width: var(--seven-days-width);
  min-width: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 10px;
}

.right-inner { min-width: max-content; }

.dates-row,
.check-row {
  display: grid;
  grid-template-columns: repeat(var(--days-count), var(--day-width));
  gap: var(--gap);
}

.dates-row {
  height: 24px;
  margin-bottom: 0;
}

.day {
  text-align: center;
  font-size: 10px;
  line-height: 1.1;
  color: #666;
}

.today { color: #111; font-weight: 800; }

.check-row {
  height: var(--row-height);
  align-items: center;
  border-bottom: 1px solid #eee;
}

.cell {
  width: 23px;
  height: 23px;
  border: 1.5px solid var(--habit-color);
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--habit-color);
  font-size: 16px;
  font-weight: 900;
  margin: 0 auto;
}

.cell.done::after { content: "✓"; }

.bad-section {
  margin-top: 16px;
}

.bad-section-title {
  display: none;
  font-size: 16px;
  font-weight: 800;
  margin: 0;
  padding: 0 0 8px 0;
  border-bottom: 1px solid #eee;
}

.bad-habit-row {
  min-height: var(--row-height);
  display: grid;
  grid-template-columns: minmax(0, 1fr) 190px;
  gap: 8px;
  align-items: center;
  border-bottom: 1px solid #eee;
  transition: transform 0.18s ease, background 0.18s ease, opacity 0.18s ease;
}

.bad-habit-name {
  min-width: 0;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.15;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  touch-action: none;
}

.bad-status {
  text-align: right;
  font-size: 12px;
  font-weight: 700;
  color: #111;
  line-height: 1.15;
  white-space: nowrap;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 20;
}

.modal-content {
  background: white;
  padding: 18px;
  border-radius: 18px;
  width: 100%;
  max-width: 360px;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
}

.type-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.type-btn {
  background: #eee;
  color: #111;
  font-weight: 700;
}

.type-btn.active { background: #111; color: #fff; }
.type-btn:disabled { opacity: 0.55; }

input, textarea, select {
  width: 100%;
  max-width: 100%;
  margin-bottom: 12px;
  padding: 12px;
  font-size: 16px;
  border-radius: 12px;
  border: 1px solid #ccc;
  background: #fff;
}

textarea {
  min-height: 74px;
  resize: none;
  overflow: hidden;
}

.description-wrap {
  position: relative;
  margin-bottom: 12px;
}

.description-wrap textarea {
  margin-bottom: 0;
  padding-bottom: 28px;
}

.char-counter {
  position: absolute;
  right: 12px;
  bottom: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #777;
  pointer-events: none;
}

.label {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
}

.quit-date-wrap { position: relative; }
#quitDateDisplay {
  cursor: pointer;
}

.quit-calendar {
  display: block;
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -46%) scale(0.96);
  width: min(320px, calc(100vw - 48px));
  z-index: 60;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 16px;
  padding: 12px;
  box-shadow: 0 14px 34px rgba(0,0,0,0.22);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.32s ease, transform 0.32s ease, visibility 0.32s ease;
}

.quit-calendar.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}

.calendar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  font-weight: 800;
}

.calendar-head button {
  background: #eee;
  color: #111;
  padding: 6px 10px;
  border-radius: 9px;
}

.calendar-head button:disabled { opacity: 0.35; }

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.calendar-weekday {
  text-align: center;
  font-size: 11px;
  font-weight: 800;
  color: #777;
  padding: 4px 0;
}

.calendar-day {
  text-align: center;
  padding: 8px 0;
  border-radius: 9px;
  font-size: 14px;
  background: #f3f3f3;
  color: #111;
}

.calendar-day.selected {
  background: #111;
  color: #fff;
  font-weight: 800;
}

.calendar-day.disabled {
  color: #b7b7b7;
  background: #f7f7f7;
  pointer-events: none;
}

.calendar-day.empty {
  background: transparent;
  pointer-events: none;
}

.refusal-info {
  font-size: 13px;
  font-weight: 700;
  margin: -2px 0 8px;
  color: #111;
}

.violations-row {
  display: none;
  align-items: center;
  gap: 10px;
  margin: 0 0 12px;
  font-size: 13px;
  font-weight: 700;
}

.violation-btn {
  width: 34px;
  height: 34px;
  padding: 0;
  border-radius: 10px;
  background: #111;
  color: #fff;
  font-size: 20px;
  font-weight: 800;
  line-height: 1;
}

.violation-btn:disabled {
  background: #ddd;
  color: #999;
}

.violation-count {
  min-width: 24px;
  text-align: center;
  font-size: 16px;
  font-weight: 800;
}

.buttons {
  display: flex;
  gap: 8px;
}

.buttons button {
  flex: 1;
  padding: 10px 8px;
}

.cancel { background: #ddd; color: #111; }
.delete-in-modal { background: #eee; color: #111; }

#habitColor { font-weight: 400; }
#habitColor option { font-weight: 400; }
#habitColor option[value="black"] { color: #111111; }
#habitColor option[value="red"] { color: #ff3b30; }
#habitColor option[value="green"] { color: #34c759; }
#habitColor option[value="blue"] { color: #007aff; }

@media (max-width: 390px) {
  :root {
    --left-width: 25vw;
    --day-width: 33px;
  }
}

#categoryColor {
  font-weight: 400;
}
#categoryColor option[value="red"] { color: #ff3b30; }
#categoryColor option[value="green"] { color: #34c759; }
#categoryColor option[value="blue"] { color: #007aff; }
#categoryColor option[value="yellow"] { color: #ffcc00; }
#categoryColor option[value="black"] { color: #111111; }

</style>
</head>
<body>

<div class="app">
  <div class="top">
    <h1>Привычки</h1>
    <button onclick="openModal()">+</button>
  </div>

  <div id="emptyState" class="empty-state">У вас пока нет привычек</div>
  <div id="goodTitle" class="main-section-title good-title-main">Хорошие привычки</div>

  <div class="tracker" id="goodTracker">
    <div class="left-column">
      <div class="corner"></div>
      <div id="leftList"></div>
    </div>

    <div class="right-scroll" id="rightScroll">
      <div class="right-inner">
        <div class="dates-row" id="datesRow"></div>
        <div id="checksList"></div>
      </div>
    </div>
  </div>

  <div class="bad-section" id="badSection">
    <div class="bad-section-title" id="badSectionTitle">Отказ от плохих привычек</div>
    <div id="badList"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle">Новая привычка</h2>

    <div class="type-switch">
      <button id="goodTypeBtn" class="type-btn active" onclick="setHabitType('good')">Хорошая</button>
      <button id="badTypeBtn" class="type-btn" onclick="setHabitType('bad')">Плохая</button>
    </div>

    <input id="habitTitle" placeholder="Название привычки">

    <div class="description-wrap">
      <textarea id="habitDescription" maxlength="1000" placeholder="Описание привычки" oninput="updateDescriptionCounter()"></textarea>
      <div id="descriptionCounter" class="char-counter">0/1000</div>
    </div>

    <div id="goodFields">
      <div class="label">Категория</div>
      <select id="habitColor" onchange="handleCategorySelect(this)">
        <option value="black">Нет</option>
        <option value="add_category">➕ Добавить</option>
      </select>
    </div>

    <div id="badFields" style="display:none;">
      <div class="label">Дата отказа</div>
      <div class="quit-date-wrap">
        <input id="quitDateDisplay" readonly onclick="toggleQuitCalendar()">
        <input id="quitDate" type="hidden">
        <div id="quitCalendar" class="quit-calendar"></div>
      </div>
      <div class="refusal-info" id="refusalInfo"></div>
      <div class="violations-row" id="violationsRow">
        <span>Нарушения</span>
        <button type="button" class="violation-btn" id="violationMinus" onclick="changeViolations(-1)">−</button>
        <span class="violation-count" id="violationCount">0</span>
        <button type="button" class="violation-btn" onclick="changeViolations(1)">+</button>
      </div>
    </div>

    <div class="buttons">
      <button onclick="saveHabit()">Сохранить</button>
      <button class="cancel" onclick="closeModal()">Отмена</button>
      <button id="deleteButton" class="delete-in-modal" onclick="deleteCurrentHabit()">Удалить</button>
    </div>
  </div>
</div>


<div class="modal" id="newCategoryModal">
  <div class="modal-content">
    <h2>Новая категория</h2>
    <div class="label">Название категории</div>
    <input id="newCategoryName" placeholder="Название категории">
    <div class="label">Цвет категории</div>
    <select id="newCategoryColor">
      <option value="red">Красный</option>
      <option value="green">Зеленый</option>
      <option value="blue">Синий</option>
      <option value="black">Черный</option>
    </select>
    <div class="buttons">
      <button onclick="saveNewCategory()">Сохранить</button>
      <button class="cancel" onclick="closeNewCategoryModal()">Отмена</button>
    </div>
  </div>
</div>

<div class="modal" id="categoryModal">
  <div class="modal-content">
    <h2 style='font-size:22px;white-space:nowrap;'>Редактировать категорию</h2>

    <div class="label">Название</div>
    <input id="categoryTitleInput" placeholder="Название">

    <div class="label">Цвет</div>
    <select id="categoryColor" onchange="colorSelect(this)">
      <option value="red" style="color:#ff3b30;">Красный</option>
      <option value="blue" style="color:#007aff;">Синий</option>
      <option value="green" style="color:#34c759;">Зелёный</option>
      <option value="yellow" style="color:#ffcc00;">Жёлтый</option>
      <option value="black" style="color:#111111;">Черный</option>
    </select>

    <div class="buttons">
      <button onclick="saveCategoryName()">Сохранить</button>
      <button class="cancel" onclick="closeCategoryModal()">Отмена</button>
    </div>
  </div>
</div>

<script>
let habits = JSON.parse(localStorage.getItem("habits")) || [];

let categoryNames = JSON.parse(localStorage.getItem("categoryNames")) || {
  black: "",
  red: "Категория",
  green: "Категория",
  blue: "Категория"
};

let categoryOrder = JSON.parse(localStorage.getItem("categoryOrder")) || ["black", "red", "green", "blue"];
let collapsedCategories = JSON.parse(localStorage.getItem("collapsedCategories")) || {};

let editingIndex = null;
let editingCategory = null;
let currentHabitType = "good";

let dragIndex = null;
let dragColor = null;
let dragBadIndex = null;
let dragCategoryIndex = null;
let startY = 0;

let calendarViewDate = new Date();
calendarViewDate.setHours(0, 0, 0, 0);

const colorMap = {
  black: "#111111",
  red: "#ff3b30",
  green: "#34c759",
  blue: "#007aff",
  yellow: "#ffcc00"
};

function normalizeHabits() {
  habits = habits.map(habit => {
    if (!habit.type) habit.type = "good";
    if (habit.type === "bad" && !habit.quitDate) habit.quitDate = todayKey();
    if (habit.type === "bad" && habit.violations === undefined) habit.violations = 0;
    return habit;
  });
}

normalizeHabits();

function save() {
  localStorage.setItem("habits", JSON.stringify(habits));
  localStorage.setItem("categoryNames", JSON.stringify(categoryNames));
  localStorage.setItem("categoryOrder", JSON.stringify(categoryOrder));
  localStorage.setItem("collapsedCategories", JSON.stringify(collapsedCategories));
}

function toDateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function todayKey() {
  const date = new Date();
  date.setHours(0, 0, 0, 0);
  return toDateKey(date);
}

function daysSince(dateKey) {
  const start = new Date(dateKey + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = today - start;
  return Math.max(0, Math.floor(diff / 86400000));
}

function dayWord(n) {
  if (n % 10 === 1 && n % 100 !== 11) return "день";
  if ([2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100)) return "дня";
  return "дней";
}

function getDates() {
  const days = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
  const result = [];

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const startPast = new Date(today);
  startPast.setMonth(startPast.getMonth() - 1);
  const futureDays = 30;

  for (let d = new Date(startPast); d < today; d.setDate(d.getDate() + 1)) {
    result.push(makeDateObject(new Date(d), false));
  }

  const todayIndex = result.length;

  for (let i = 0; i <= futureDays; i++) {
    const date = new Date(today);
    date.setDate(today.getDate() + i);
    result.push(makeDateObject(date, i === 0));
  }

  function makeDateObject(date, isToday) {
    const dayName = days[date.getDay()];
    const dd = String(date.getDate()).padStart(2, "0");
    const mm = String(date.getMonth() + 1).padStart(2, "0");

    return {
      label: `${dayName}<br>${dd}.${mm}`,
      key: toDateKey(date),
      isToday
    };
  }

  return { result, todayIndex };
}

function isGoodHabit(habit) {
  return (habit.type || "good") === "good";
}


function getCategoryListForRender() {
  const list = [{ id: "black", name: "", color: "black" }];

  const usedOldColors = ["red", "green", "blue"].filter(colorKey =>
    habits.some(habit => isGoodHabit(habit) && habit.color === colorKey)
  );

  usedOldColors.forEach(colorKey => {
    list.push({
      id: colorKey,
      name: categoryNames[colorKey] || "Категория",
      color: colorKey
    });
  });

  customCategories.forEach(cat => {
    const hasHabits = habits.some(habit => isGoodHabit(habit) && habit.color === cat.id);
    if (hasHabits) {
      list.push({
        id: cat.id,
        name: cat.name,
        color: cat.color || "black"
      });
    }
  });

  return list;
}

function getCategoryRenderColor(category) {
  return colorMap[category.color] || colorMap.black;
}

function render() {
  const { result: dates, todayIndex } = getDates();

  document.documentElement.style.setProperty("--days-count", dates.length);

  const datesRow = document.getElementById("datesRow");
  const leftList = document.getElementById("leftList");
  const checksList = document.getElementById("checksList");
  const badList = document.getElementById("badList");
  const badSectionTitle = document.getElementById("badSectionTitle");
  const goodTitle = document.getElementById("goodTitle");
  const emptyState = document.getElementById("emptyState");
  const goodTracker = document.getElementById("goodTracker");

  const goodHabits = habits.filter(isGoodHabit);
  const badHabits = habits.filter(habit => habit.type === "bad");

  emptyState.style.display = habits.length === 0 ? "block" : "none";
  goodTitle.style.display = goodHabits.length ? "block" : "none";
  goodTracker.style.display = goodHabits.length ? "grid" : "none";

  datesRow.innerHTML = "";
  leftList.innerHTML = "";
  checksList.innerHTML = "";
  badList.innerHTML = "";

  dates.forEach(date => {
    datesRow.innerHTML += `<div class="day ${date.isToday ? "today" : ""}">${date.label}</div>`;
  });

  getCategoryListForRender().forEach((category, categoryIndex) => {
    const categoryKey = category.id;
    const categoryHabits = habits.filter(habit => isGoodHabit(habit) && (habit.color || "black") === categoryKey);
    if (categoryHabits.length === 0) return;

    const color = getCategoryRenderColor(category);
    const isCollapsed = collapsedCategories[categoryKey];

    if (categoryKey !== "black") {
      leftList.innerHTML += `
        <div class="category-left" data-category-index="${categoryIndex}" style="color:${color}"
          onclick="openCategoryModal('${categoryKey}')"
          ontouchstart="startCategoryDrag(event, ${categoryIndex})"
          ontouchmove="moveCategoryDrag(event)"
          ontouchend="endCategoryDrag(event)">
          <div class="category-title">${category.name}</div>
          <div class="category-arrow" onclick="toggleCategory(event, '${categoryKey}')" style="color:${color}">
            ${isCollapsed ? "▲" : "▼"}
          </div>
        </div>
      `;

      checksList.innerHTML += `<div class="category-spacer"></div>`;
    }

    if (isCollapsed) return;

    habits.forEach((habit, habitIndex) => {
      if (!isGoodHabit(habit) || (habit.color || "black") !== categoryKey) return;

      leftList.innerHTML += `
        <div class="habit-left" data-index="${habitIndex}">
          <div class="name-wrap"
            onclick="editHabit(${habitIndex})"
            ontouchstart="startDrag(event, ${habitIndex})"
            ontouchmove="moveDrag(event)"
            ontouchend="endDrag(event)">
            <div class="habit-name" style="color:${color}">${habit.title}</div>
          </div>
        </div>
      `;

      let row = `<div class="check-row" style="--habit-color:${color}">`;

      dates.forEach(date => {
        const done = habit.done && habit.done[date.key];
        row += `<div class="cell ${done ? "done" : ""}" onclick="toggleHabit(${habitIndex}, '${date.key}')"></div>`;
      });

      row += `</div>`;
      checksList.innerHTML += row;
    });
  });

  badSectionTitle.style.display = badHabits.length ? "block" : "none";

  badHabits.forEach((habit, badPosition) => {
    const realIndex = habits.indexOf(habit);
    const count = daysSince(habit.quitDate || todayKey());

    badList.innerHTML += `
      <div class="bad-habit-row" data-bad-index="${badPosition}">
        <div class="bad-habit-name"
          onclick="editHabit(${realIndex})"
          ontouchstart="startBadDrag(event, ${badPosition})"
          ontouchmove="moveBadDrag(event)"
          ontouchend="endBadDrag(event)">${habit.title}</div>
        <div class="bad-status">
          <div>Вы отказались ${count} ${dayWord(count)} назад</div>
          <div>Вы нарушили ${habit.violations || 0} раз</div>
        </div>
      </div>
    `;
  });

  setTimeout(() => {
    const scroll = document.getElementById("rightScroll");
    if (!window.initialScrollDone) {
      const dayWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--day-width"));
      scroll.scrollLeft = todayIndex * (dayWidth + 3);
      window.initialScrollDone = true;
    }
  }, 0);
}

function toggleCategory(event, colorKey) {
  event.stopPropagation();
  collapsedCategories[colorKey] = !collapsedCategories[colorKey];
  save();
  render();
}

function startCategoryDrag(event, index) {
  dragCategoryIndex = index;
  startY = event.touches[0].clientY;
  const row = document.querySelector(`[data-category-index="${index}"]`);
  if (row) row.classList.add("dragging");
}

function moveCategoryDrag(event) {
  event.preventDefault();
  if (dragCategoryIndex === null) return;

  const currentY = event.touches[0].clientY;
  const diff = currentY - startY;

  if (diff > 34 && dragCategoryIndex < categoryOrder.length - 1) {
    const temp = categoryOrder[dragCategoryIndex];
    categoryOrder[dragCategoryIndex] = categoryOrder[dragCategoryIndex + 1];
    categoryOrder[dragCategoryIndex + 1] = temp;
    dragCategoryIndex++;
    startY = currentY;
    save();
    render();
  }

  if (diff < -34 && dragCategoryIndex > 0) {
    const temp = categoryOrder[dragCategoryIndex];
    categoryOrder[dragCategoryIndex] = categoryOrder[dragCategoryIndex - 1];
    categoryOrder[dragCategoryIndex - 1] = temp;
    dragCategoryIndex--;
    startY = currentY;
    save();
    render();
  }
}

function endCategoryDrag() {
  dragCategoryIndex = null;
  document.querySelectorAll(".category-left").forEach(row => row.classList.remove("dragging"));
}

function startDrag(event, index) {
  if (!isGoodHabit(habits[index])) return;
  dragIndex = index;
  dragColor = habits[index].color;
  startY = event.touches[0].clientY;
  const row = document.querySelector(`[data-index="${index}"]`);
  if (row) row.classList.add("dragging");
}

function moveDrag(event) {
  event.preventDefault();
  if (dragIndex === null) return;

  const currentY = event.touches[0].clientY;
  const diff = currentY - startY;

  if (diff > 42) {
    moveWithinCategory(1);
    startY = currentY;
  }

  if (diff < -42) {
    moveWithinCategory(-1);
    startY = currentY;
  }
}

function moveWithinCategory(direction) {
  const sameColorIndexes = habits
    .map((habit, index) => ({ habit, index }))
    .filter(item => isGoodHabit(item.habit) && item.habit.color === dragColor)
    .map(item => item.index);

  const currentPosition = sameColorIndexes.indexOf(dragIndex);
  const targetPosition = currentPosition + direction;
  if (targetPosition < 0 || targetPosition >= sameColorIndexes.length) return;

  const targetIndex = sameColorIndexes[targetPosition];
  const temp = habits[dragIndex];
  habits[dragIndex] = habits[targetIndex];
  habits[targetIndex] = temp;
  dragIndex = targetIndex;

  save();
  render();

  const row = document.querySelector(`[data-index="${dragIndex}"]`);
  if (row) row.classList.add("dragging");
}

function endDrag() {
  dragIndex = null;
  dragColor = null;
  document.querySelectorAll(".habit-left").forEach(row => row.classList.remove("dragging"));
}

function startBadDrag(event, badPosition) {
  dragBadIndex = badPosition;
  startY = event.touches[0].clientY;
  const row = document.querySelector(`[data-bad-index="${badPosition}"]`);
  if (row) row.classList.add("dragging");
}

function moveBadDrag(event) {
  event.preventDefault();
  if (dragBadIndex === null) return;

  const currentY = event.touches[0].clientY;
  const diff = currentY - startY;

  if (diff > 42) {
    moveBadHabit(1);
    startY = currentY;
  }

  if (diff < -42) {
    moveBadHabit(-1);
    startY = currentY;
  }
}

function moveBadHabit(direction) {
  const badIndexes = habits
    .map((habit, index) => ({ habit, index }))
    .filter(item => item.habit.type === "bad")
    .map(item => item.index);

  const currentHabitIndex = badIndexes[dragBadIndex];
  const targetBadPosition = dragBadIndex + direction;
  if (targetBadPosition < 0 || targetBadPosition >= badIndexes.length) return;

  const targetHabitIndex = badIndexes[targetBadPosition];
  const temp = habits[currentHabitIndex];
  habits[currentHabitIndex] = habits[targetHabitIndex];
  habits[targetHabitIndex] = temp;
  dragBadIndex = targetBadPosition;

  save();
  render();

  const row = document.querySelector(`[data-bad-index="${dragBadIndex}"]`);
  if (row) row.classList.add("dragging");
}

function endBadDrag() {
  dragBadIndex = null;
  document.querySelectorAll(".bad-habit-row").forEach(row => row.classList.remove("dragging"));
}

function toggleHabit(habitIndex, dateKey) {
  if (!isGoodHabit(habits[habitIndex])) return;

  if (!habits[habitIndex].done) habits[habitIndex].done = {};
  habits[habitIndex].done[dateKey] = !habits[habitIndex].done[dateKey];

  save();
  render();
}

function setHabitType(type) {
  if (editingIndex !== null) return;
  currentHabitType = type;
  updateHabitTypeUI(false);
}

function updateHabitTypeUI(disabled) {
  const goodBtn = document.getElementById("goodTypeBtn");
  const badBtn = document.getElementById("badTypeBtn");
  const goodFields = document.getElementById("goodFields");
  const badFields = document.getElementById("badFields");

  goodBtn.classList.toggle("active", currentHabitType === "good");
  badBtn.classList.toggle("active", currentHabitType === "bad");
  goodBtn.disabled = disabled;
  badBtn.disabled = disabled;

  goodFields.style.display = currentHabitType === "good" ? "block" : "none";
  badFields.style.display = currentHabitType === "bad" ? "block" : "none";

  if (currentHabitType === "bad") {
    if (!document.getElementById("quitDate").value) setQuitDateValue(todayKey());
    updateRefusalInfo();
  } else {
    hideQuitCalendar();
  }
}

function openModal() {
  editingIndex = null;
  currentHabitType = "good";

  document.getElementById("modalTitle").textContent = "Новая привычка";
  document.getElementById("habitTitle").value = "";
  document.getElementById("habitDescription").value = "";
  document.getElementById("habitDescription").style.height = "74px";
  updateDescriptionCounter();
  document.getElementById("habitColor").value = "black";
  colorSelect(document.getElementById("habitColor"));
  setQuitDateValue(todayKey());
  setViolationsValue(0);
  document.getElementById("violationsRow").style.display = "none";
  document.getElementById("deleteButton").style.display = "none";

  updateHabitTypeUI(false);
  updateRefusalInfo();

  document.getElementById("modal").style.display = "flex";
}

function editHabit(index) {
  if (dragIndex !== null || dragBadIndex !== null) return;

  editingIndex = index;
  currentHabitType = habits[index].type === "bad" ? "bad" : "good";

  document.getElementById("modalTitle").textContent = "Редактировать привычку";
  document.getElementById("habitTitle").value = habits[index].title;
  document.getElementById("habitDescription").value = habits[index].description || "";
  updateDescriptionCounter();
  document.getElementById("habitColor").value = habits[index].color || "black";
  colorSelect(document.getElementById("habitColor"));
  setQuitDateValue(habits[index].quitDate || todayKey());
  setViolationsValue(habits[index].violations || 0);
  document.getElementById("violationsRow").style.display = currentHabitType === "bad" ? "flex" : "none";
  document.getElementById("deleteButton").style.display = "block";

  updateHabitTypeUI(true);

  document.getElementById("modal").style.display = "flex";

  setTimeout(() => {
    autoResize(document.getElementById("habitDescription"));
    updateRefusalInfo();
  }, 0);
}

function saveHabit() {
  const title = document.getElementById("habitTitle").value.trim();
  const description = document.getElementById("habitDescription").value.trim();
  const color = document.getElementById("habitColor").value;
  const quitDate = document.getElementById("quitDate").value || todayKey();
  const violations = Number(document.getElementById("violationCount").textContent) || 0;

  if (!title) return;

  if (editingIndex !== null) {
    habits[editingIndex].title = title;
    habits[editingIndex].description = description;

    if (currentHabitType === "good") {
      habits[editingIndex].type = "good";
      habits[editingIndex].color = color;
      delete habits[editingIndex].quitDate;
    } else {
      habits[editingIndex].type = "bad";
      habits[editingIndex].quitDate = quitDate;
      habits[editingIndex].violations = violations;
      habits[editingIndex].color = "black";
      delete habits[editingIndex].done;
    }
  } else {
    if (currentHabitType === "good") {
      habits.push({
        id: Date.now(),
        type: "good",
        title,
        description,
        color,
        done: {}
      });
    } else {
      habits.push({
        id: Date.now(),
        type: "bad",
        title,
        description,
        color: "black",
        quitDate,
        violations: 0
      });
    }
  }

  save();
  closeModal();
  render();
}

function deleteCurrentHabit() {
  if (editingIndex === null) return;

  if (confirm("Удалить привычку?")) {
    habits.splice(editingIndex, 1);
    save();
    closeModal();
    render();
  }
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
  hideQuitCalendar();
  editingIndex = null;
}

function openCategoryModal(colorKey) {
  if (dragCategoryIndex !== null) return;
  if (colorKey === "black") return;

  editingCategory = colorKey;

  const customCategory = customCategories.find(cat => cat.id === colorKey);
  document.getElementById("categoryTitleInput").value =
    customCategory ? customCategory.name : (categoryNames[colorKey] || "Категория");

  const categoryColor = document.getElementById("categoryColor");
  if (categoryColor) {
    categoryColor.value = customCategory ? (customCategory.color || "black") : colorKey;
    colorSelect(categoryColor);
  }

  document.getElementById("categoryModal").style.display = "flex";
}

function saveCategoryName() {
  const value = document.getElementById("categoryTitleInput").value.trim();
  if (!value || !editingCategory) return;

  const color = document.getElementById("categoryColor") ? document.getElementById("categoryColor").value : editingCategory;
  const customCategory = customCategories.find(cat => cat.id === editingCategory);

  if (customCategory) {
    customCategory.name = value;
    customCategory.color = color;
    localStorage.setItem("customCategories", JSON.stringify(customCategories));
  } else {
    categoryNames[editingCategory] = value;

    if (color && color !== editingCategory) {
      habits.forEach(habit => {
        if (isGoodHabit(habit) && habit.color === editingCategory) {
          habit.color = color;
        }
      });

      categoryNames[color] = value;
      delete categoryNames[editingCategory];

      collapsedCategories[color] = collapsedCategories[editingCategory];
      delete collapsedCategories[editingCategory];

      editingCategory = color;
    }
  }

  save();
  closeCategoryModal();
  render();
}

function closeCategoryModal() {
  document.getElementById("categoryModal").style.display = "none";
  editingCategory = null;
}

function updateDescriptionCounter() {
  const textarea = document.getElementById("habitDescription");
  if (textarea.value.length > 1000) textarea.value = textarea.value.slice(0, 1000);
  document.getElementById("descriptionCounter").textContent = `${textarea.value.length}/1000`;
  autoResize(textarea);
}

function autoResize(textarea) {
  textarea.style.height = "auto";
  textarea.style.height = textarea.scrollHeight + "px";
}

function colorSelect(select) {
  const colors = {
    black: "#111111",
    red: "#ff3b30",
    green: "#34c759",
    blue: "#007aff",
    yellow: "#ffcc00"
  };
  select.style.color = colors[select.value] || "#111111";
}

function formatDisplayDate(dateKey) {
  const [y, m, d] = dateKey.split("-");
  return `${d}.${m}.${y}`;
}

function setQuitDateValue(dateKey) {
  const max = todayKey();
  if (!dateKey || dateKey > max) dateKey = max;

  document.getElementById("quitDate").value = dateKey;
  document.getElementById("quitDateDisplay").value = formatDisplayDate(dateKey);

  calendarViewDate = new Date(dateKey + "T00:00:00");
  calendarViewDate.setHours(0, 0, 0, 0);

  updateRefusalInfo();
  renderQuitCalendar();
}

function updateRefusalInfo() {
  const quitDate = document.getElementById("quitDate").value || todayKey();
  const count = daysSince(quitDate);
  document.getElementById("refusalInfo").textContent = `Вы отказались ${count} ${dayWord(count)} назад`;
}

function toggleQuitCalendar() {
  const calendar = document.getElementById("quitCalendar");
  calendar.classList.toggle("open");
  renderQuitCalendar();
}

function hideQuitCalendar() {
  const calendar = document.getElementById("quitCalendar");
  if (calendar) calendar.classList.remove("open");
}

function changeCalendarMonth(delta) {
  calendarViewDate.setMonth(calendarViewDate.getMonth() + delta);
  renderQuitCalendar();
}

function renderQuitCalendar() {
  const calendar = document.getElementById("quitCalendar");
  if (!calendar) return;

  const today = new Date(todayKey() + "T00:00:00");
  const selectedKey = document.getElementById("quitDate").value || todayKey();

  const year = calendarViewDate.getFullYear();
  const month = calendarViewDate.getMonth();
  const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
  const weekdays = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

  const currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  const nextMonth = new Date(year, month + 1, 1);
  const nextDisabled = nextMonth > currentMonth;

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const offset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

  let html = `
    <div class="calendar-head">
      <button type="button" onclick="changeCalendarMonth(-1)">‹</button>
      <div>${monthNames[month]} ${year}</div>
      <button type="button" onclick="changeCalendarMonth(1)" ${nextDisabled ? "disabled" : ""}>›</button>
    </div>
    <div class="calendar-grid">
  `;

  weekdays.forEach(day => {
    html += `<div class="calendar-weekday">${day}</div>`;
  });

  for (let i = 0; i < offset; i++) {
    html += `<div class="calendar-day empty"></div>`;
  }

  for (let day = 1; day <= lastDay.getDate(); day++) {
    const date = new Date(year, month, day);
    date.setHours(0, 0, 0, 0);
    const key = toDateKey(date);
    const disabled = date > today;
    const selected = key === selectedKey;

    html += `
      <div class="calendar-day ${disabled ? "disabled" : ""} ${selected ? "selected" : ""}"
        ${disabled ? "" : `onclick="setQuitDateValue('${key}'); hideQuitCalendar();"`}>
        ${day}
      </div>
    `;
  }

  html += `</div>`;
  calendar.innerHTML = html;
}


function setViolationsValue(value) {
  const count = Math.max(0, Number(value) || 0);
  const countEl = document.getElementById("violationCount");
  const minusBtn = document.getElementById("violationMinus");

  if (countEl) countEl.textContent = count;
  if (minusBtn) minusBtn.disabled = count <= 0;
}

function changeViolations(delta) {
  const current = Number(document.getElementById("violationCount").textContent) || 0;
  setViolationsValue(current + delta);
}


let customCategories = JSON.parse(localStorage.getItem("customCategories")) || [];

function refreshCategorySelect(){
 const s=document.getElementById('habitColor');
 if(!s) return;
 const cur=s.value;
 s.innerHTML='<option value="black">Нет</option>';
 customCategories.forEach(c=>{
   const o=document.createElement('option');
   o.value=c.id;o.textContent=c.name;o.style.color=c.color;
   s.appendChild(o);
 });
 const a=document.createElement('option');
 a.value='add_category';a.textContent='➕ Добавить';
 s.appendChild(a);
 if(cur && cur!=='add_category') s.value=cur;
}

function handleCategorySelect(sel){
 if(sel.value==='add_category'){openNewCategoryModal(); sel.value='black';}
}

function openNewCategoryModal(){
 document.getElementById('newCategoryModal').style.display='flex';
}
function closeNewCategoryModal(){
 document.getElementById('newCategoryModal').style.display='none';
}
function saveNewCategory(){
 const name=document.getElementById('newCategoryName').value.trim();
 const color=document.getElementById('newCategoryColor').value;
 if(!name) return;
 const cat={id:'cat_'+Date.now(),name,color};
 customCategories.push(cat);
 localStorage.setItem('customCategories',JSON.stringify(customCategories));
 refreshCategorySelect();
 document.getElementById('habitColor').value=cat.id;
 closeNewCategoryModal();
}
refreshCategorySelect();

render();
</script>
