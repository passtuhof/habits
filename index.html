<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Привычки</title>

<style>
:root {
  --left-width: 25vw;
  --day-width: 35px;
  --row-height: 44px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  margin: 0;
  background: #fff;
  color: #111;
}

.app {
  padding: 14px;
  max-width: 620px;
  margin: 0 auto;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

h1 {
  margin: 0;
  font-size: 28px;
}

button {
  border: none;
  background: #111;
  color: #fff;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 15px;
}

.tracker {
  display: grid;
  grid-template-columns: var(--left-width) 1fr;
  gap: 8px;
}

.corner {
  height: 38px;
  margin-bottom: 0;
}

.empty-state {
  display: none;
  font-size: 15px;
  font-weight: 700;
  color: #555;
  padding: 18px 0;
}

.main-section-title {
  width: 100%;
  font-size: 15px;
  font-weight: 800;
  color: #111;
  padding: 10px 0 8px;
  border-bottom: 1px solid #eee;
}

.good-title-main {
  display: none;
  margin: 20px 0 10px;
}

.category-left,
.bad-title-left {
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  border-bottom: 1px solid #eee;
  font-size: 15px;
  font-weight: 800;
  touch-action: none;
}

.category-left.dragging {
  transform: scale(1.035);
  background: rgba(0,0,0,0.05);
  border-radius: 10px;
  opacity: 0.8;
}

.category-title,
.bad-title-text {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bad-title-left {
  width: calc(100vw - 28px);
  max-width: 620px;
  position: relative;
  z-index: 4;
  background: #fff;
}

.bad-title-text {
  overflow: visible;
  text-overflow: clip;
}

.category-arrow {
  font-size: 12px;
  flex-shrink: 0;
}

.category-spacer,
.bad-title-right {
  height: 34px;
  border-bottom: 1px solid #eee;
}

.habit-left {
  height: var(--row-height);
  display: flex;
  align-items: center;
  border-bottom: 1px solid #eee;
  transition: transform 0.18s ease, background 0.18s ease, opacity 0.18s ease;
}

.habit-left.dragging {
  transform: scale(1.035);
  background: rgba(0,0,0,0.05);
  border-radius: 10px;
  opacity: 0.8;
}

.name-wrap {
  min-width: 0;
  flex: 1;
  touch-action: none;
}

.habit-name {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.15;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  white-space: normal;
  overflow: hidden;
  text-overflow: ellipsis;
}

.right-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 10px;
}

.right-inner {
  min-width: max-content;
}

.dates-row {
  display: grid;
  grid-template-columns: repeat(var(--days-count), var(--day-width));
  gap: 3px;
  height: 38px;
  margin-bottom: 0;
}

.day {
  text-align: center;
  font-size: 10px;
  line-height: 1.1;
  color: #666;
}

.today {
  color: #111;
  font-weight: 800;
}

.check-row {
  display: grid;
  grid-template-columns: repeat(var(--days-count), var(--day-width));
  gap: 3px;
  height: var(--row-height);
  align-items: center;
  border-bottom: 1px solid #eee;
}

.bad-row {
  height: var(--row-height);
  display: flex;
  align-items: center;
  border-bottom: 1px solid #eee;
}

.bad-status {
  position: sticky;
  left: 0;
  display: inline-flex;
  align-items: center;
  height: 100%;
  font-size: 13px;
  font-weight: 700;
  color: #111;
  background: #fff;
  padding-right: 12px;
  white-space: nowrap;
}

.cell {
  width: 23px;
  height: 23px;
  border: 1.5px solid var(--habit-color);
  border-radius: 7px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--habit-color);
  font-size: 16px;
  font-weight: 900;
  margin: 0 auto;
}

.cell.done::after {
  content: "✓";
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 20;
}

.modal-content {
  background: white;
  padding: 18px;
  border-radius: 18px;
  width: 100%;
  max-width: 360px;
  max-height: 88vh;
  overflow-y: auto;
}

.type-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.type-btn {
  background: #eee;
  color: #111;
  font-weight: 700;
}

.type-btn.active {
  background: #111;
  color: #fff;
}

.type-btn.disabled {
  opacity: 0.55;
}

input, textarea, select {
  width: 100%;
  box-sizing: border-box;
  margin-bottom: 12px;
  padding: 12px;
  font-size: 16px;
  border-radius: 12px;
  border: 1px solid #ccc;
}

textarea {
  min-height: 74px;
  resize: none;
  overflow: hidden;
}

.description-wrap {
  position: relative;
  margin-bottom: 12px;
}

.description-wrap textarea {
  margin-bottom: 0;
  padding-bottom: 28px;
}

.char-counter {
  position: absolute;
  right: 12px;
  bottom: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #777;
  pointer-events: none;
}

.quit-date-wrap {
  position: relative;
}

#quitDateDisplay {
  cursor: pointer;
}

.quit-calendar {
  display: none;
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(320px, calc(100vw - 48px));
  z-index: 60;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 16px;
  padding: 12px;
  box-shadow: 0 14px 34px rgba(0,0,0,0.22);
  box-sizing: border-box;
}

.calendar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  font-weight: 800;
}

.calendar-head button {
  background: #eee;
  color: #111;
  padding: 6px 10px;
  border-radius: 9px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.calendar-weekday {
  text-align: center;
  font-size: 11px;
  font-weight: 800;
  color: #777;
  padding: 4px 0;
}

.calendar-day {
  text-align: center;
  padding: 8px 0;
  border-radius: 9px;
  font-size: 14px;
  background: #f3f3f3;
  color: #111;
}

.calendar-day.selected {
  background: #111;
  color: #fff;
  font-weight: 800;
}

.calendar-day.disabled {
  color: #b7b7b7;
  background: #f7f7f7;
  pointer-events: none;
}

.calendar-day.empty {
  background: transparent;
  pointer-events: none;
}

.label {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
}

.bad-counter {
  font-size: 13px;
  font-weight: 700;
  margin: -4px 0 12px 0;
}

.buttons {
  display: flex;
  gap: 8px;
}

.buttons button {
  flex: 1;
  padding: 10px 8px;
}

.cancel {
  background: #ddd;
  color: #111;
}

.delete-in-modal {
  background: #eee;
  color: #111;
}

#habitColor {
  font-weight: 700;
}

#habitColor option {
  font-weight: 700;
}

#habitColor option[value="black"] { color: #111111; }
#habitColor option[value="red"] { color: #ff3b30; }
#habitColor option[value="green"] { color: #34c759; }
#habitColor option[value="blue"] { color: #007aff; }

@media (max-width: 390px) {
  :root {
    --left-width: 25vw;
    --day-width: 35px;
  }
}
</style>
</head>

<body>

<div class="app">
  <div class="top">
    <h1>Привычки</h1>
    <button onclick="openModal()">+</button>
  </div>

  <div id="emptyState" class="empty-state">У вас пока нет привычек</div>
  <div id="goodTitle" class="main-section-title good-title-main">Хорошие привычки</div>

  <div class="tracker">
    <div class="left-column">
      <div class="corner"></div>
      <div id="leftList"></div>
    </div>

    <div class="right-scroll" id="rightScroll">
      <div class="right-inner">
        <div class="dates-row" id="datesRow"></div>
        <div id="checksList"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle">Новая привычка</h2>

    <div class="type-switch">
      <button id="goodTypeBtn" class="type-btn active" onclick="setHabitType('good')">Хорошая</button>
      <button id="badTypeBtn" class="type-btn" onclick="setHabitType('bad')">Плохая</button>
    </div>

    <input id="habitTitle" placeholder="Название привычки">
    <div class="description-wrap">
      <textarea id="habitDescription" maxlength="1000" placeholder="Описание привычки" oninput="updateDescriptionCounter()"></textarea>
      <div id="descriptionCounter" class="char-counter">0/1000</div>
    </div>

    <div id="goodFields">
      <div class="label">Категория</div>
      <select id="habitColor" onchange="colorSelect(this)">
        <option value="black" style="color:#111111;font-weight:700;">Нет</option>
        <option value="red" style="color:#ff3b30;font-weight:700;">Красная</option>
        <option value="green" style="color:#34c759;font-weight:700;">Зеленая</option>
        <option value="blue" style="color:#007aff;font-weight:700;">Синяя</option>
      </select>
    </div>

    <div id="badFields" style="display:none;">
      <div class="label">Дата отказа</div>
      <div class="quit-date-wrap">
        <input id="quitDateDisplay" readonly onclick="toggleQuitCalendar()">
        <input id="quitDate" type="hidden">
        <div id="quitCalendar" class="quit-calendar"></div>
      </div>
      <div id="quitCounter" class="bad-counter"></div>
    </div>

    <div class="buttons">
      <button onclick="saveHabit()">Сохранить</button>
      <button class="cancel" onclick="closeModal()">Отмена</button>
      <button id="deleteButton" class="delete-in-modal" onclick="deleteCurrentHabit()">Удалить</button>
    </div>
  </div>
</div>

<div class="modal" id="categoryModal">
  <div class="modal-content">
    <h2>Название категории</h2>

    <input id="categoryTitleInput" placeholder="Название категории">

    <div class="buttons">
      <button onclick="saveCategoryName()">Сохранить</button>
      <button class="cancel" onclick="closeCategoryModal()">Отмена</button>
    </div>
  </div>
</div>

<script>
let habits = JSON.parse(localStorage.getItem("habits")) || [];

let categoryNames = JSON.parse(localStorage.getItem("categoryNames")) || {
  black: "",
  red: "Категория",
  green: "Категория",
  blue: "Категория"
};

let categoryOrder = JSON.parse(localStorage.getItem("categoryOrder")) || ["black", "red", "green", "blue"];
let collapsedCategories = JSON.parse(localStorage.getItem("collapsedCategories")) || {};

let editingIndex = null;
let editingCategory = null;
let currentHabitType = "good";
let calendarViewDate = new Date();
calendarViewDate.setHours(0, 0, 0, 0);

let dragIndex = null;
let dragColor = null;
let dragCategoryIndex = null;
let startY = 0;

const colorMap = {
  black: "#111111",
  red: "#ff3b30",
  green: "#34c759",
  blue: "#007aff"
};

function normalizeHabits() {
  habits = habits.map(habit => {
    if (!habit.type) habit.type = "good";
    if (habit.type === "bad" && !habit.quitDate) habit.quitDate = toDateKey(new Date());
    return habit;
  });
}

normalizeHabits();

function save() {
  localStorage.setItem("habits", JSON.stringify(habits));
  localStorage.setItem("categoryNames", JSON.stringify(categoryNames));
  localStorage.setItem("categoryOrder", JSON.stringify(categoryOrder));
  localStorage.setItem("collapsedCategories", JSON.stringify(collapsedCategories));
}

function toDateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function getTodayKey() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return toDateKey(today);
}

function daysSince(dateKey) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const date = new Date(dateKey + "T00:00:00");
  date.setHours(0, 0, 0, 0);

  const diff = today - date;
  return Math.max(0, Math.floor(diff / 86400000));
}

function getDaysText(n) {
  if (n % 10 === 1 && n % 100 !== 11) return "день";
  if ([2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100)) return "дня";
  return "дней";
}

function getDates() {
  const days = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
  const result = [];

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const startPast = new Date(2026, 4, 1);
  const futureDays = 30;

  for (let d = new Date(startPast); d < today; d.setDate(d.getDate() + 1)) {
    result.push(makeDateObject(new Date(d), false));
  }

  const todayIndex = result.length;

  for (let i = 0; i <= futureDays; i++) {
    const date = new Date(today);
    date.setDate(today.getDate() + i);
    result.push(makeDateObject(date, i === 0));
  }

  function makeDateObject(date, isToday) {
    const dayName = days[date.getDay()];
    const dd = String(date.getDate()).padStart(2, "0");
    const mm = String(date.getMonth() + 1).padStart(2, "0");

    return {
      label: `${dayName}<br>${dd}.${mm}`,
      key: toDateKey(date),
      isToday
    };
  }

  return { result, todayIndex };
}

function render() {
  const { result: dates, todayIndex } = getDates();

  document.documentElement.style.setProperty("--days-count", dates.length);

  const datesRow = document.getElementById("datesRow");
  const leftList = document.getElementById("leftList");
  const checksList = document.getElementById("checksList");
  const emptyState = document.getElementById("emptyState");
  const goodTitle = document.getElementById("goodTitle");

  emptyState.style.display = habits.length === 0 ? "block" : "none";
  document.querySelector(".tracker").style.display = habits.length === 0 ? "none" : "grid";
  goodTitle.style.display = habits.some(habit => (habit.type || "good") === "good") ? "block" : "none";

  datesRow.innerHTML = "";
  leftList.innerHTML = "";
  checksList.innerHTML = "";

  dates.forEach(date => {
    datesRow.innerHTML += `
      <div class="day ${date.isToday ? "today" : ""}">
        ${date.label}
      </div>
    `;
  });

  categoryOrder.forEach((colorKey, categoryIndex) => {
    const categoryHabits = habits.filter(habit => (habit.type || "good") === "good" && habit.color === colorKey);
    if (categoryHabits.length === 0) return;

    const color = colorMap[colorKey];
    const isCollapsed = collapsedCategories[colorKey];

    if (colorKey !== "black") {
      leftList.innerHTML += `
        <div class="category-left" data-category-index="${categoryIndex}" style="color:${color}"
          onclick="openCategoryModal('${colorKey}')"
          ontouchstart="startCategoryDrag(event, ${categoryIndex})"
          ontouchmove="moveCategoryDrag(event)"
          ontouchend="endCategoryDrag(event)">
          <div class="category-title">${categoryNames[colorKey]}</div>
          <div class="category-arrow" onclick="toggleCategory(event, '${colorKey}')" style="color:${color}">
            ${isCollapsed ? "▲" : "▼"}
          </div>
        </div>
      `;

      checksList.innerHTML += `<div class="category-spacer"></div>`;
    }

    if (isCollapsed) return;

    habits.forEach((habit, habitIndex) => {
      if ((habit.type || "good") !== "good") return;
      if (habit.color !== colorKey) return;

      leftList.innerHTML += `
        <div class="habit-left" data-index="${habitIndex}">
          <div class="name-wrap"
            onclick="editHabit(${habitIndex})"
            ontouchstart="startDrag(event, ${habitIndex})"
            ontouchmove="moveDrag(event)"
            ontouchend="endDrag(event)">
            <div class="habit-name" style="color:${color}">
              ${habit.title}
            </div>
          </div>
        </div>
      `;

      let row = `<div class="check-row" style="--habit-color:${color}">`;

      dates.forEach(date => {
        const done = habit.done && habit.done[date.key];

        row += `
          <div class="cell ${done ? "done" : ""}"
            onclick="toggleHabit(${habitIndex}, '${date.key}')">
          </div>
        `;
      });

      row += `</div>`;
      checksList.innerHTML += row;
    });
  });

  renderBadHabits();

  setTimeout(() => {
    const scroll = document.getElementById("rightScroll");

    if (!window.initialScrollDone) {
      const dayWidth = parseInt(
        getComputedStyle(document.documentElement)
          .getPropertyValue("--day-width")
      );

      scroll.scrollLeft = todayIndex * (dayWidth + 3);
      window.initialScrollDone = true;
    }
  }, 0);
}

function renderBadHabits() {
  const badHabits = habits
    .map((habit, index) => ({ habit, index }))
    .filter(item => item.habit.type === "bad");

  if (badHabits.length === 0) return;

  const leftList = document.getElementById("leftList");
  const checksList = document.getElementById("checksList");

  leftList.innerHTML += `
    <div class="bad-title-left">
      <div class="bad-title-text">Отказ от плохих привычек</div>
    </div>
  `;
  checksList.innerHTML += `<div class="bad-title-right"></div>`;

  badHabits.forEach(item => {
    const days = daysSince(item.habit.quitDate || getTodayKey());

    leftList.innerHTML += `
      <div class="habit-left" data-index="${item.index}">
        <div class="name-wrap" onclick="editHabit(${item.index})">
          <div class="habit-name" style="color:#111">
            ${item.habit.title}
          </div>
        </div>
      </div>
    `;

    checksList.innerHTML += `
      <div class="bad-row">
        <div class="bad-status">Вы отказались ${days} ${getDaysText(days)} назад</div>
      </div>
    `;
  });
}

function toggleCategory(event, colorKey) {
  event.stopPropagation();
  collapsedCategories[colorKey] = !collapsedCategories[colorKey];
  save();
  render();
}

function startCategoryDrag(event, index) {
  dragCategoryIndex = index;
  startY = event.touches[0].clientY;

  const row = document.querySelector(`[data-category-index="${index}"]`);
  if (row) row.classList.add("dragging");
}

function moveCategoryDrag(event) {
  event.preventDefault();
  if (dragCategoryIndex === null) return;

  const currentY = event.touches[0].clientY;
  const diff = currentY - startY;

  if (diff > 34 && dragCategoryIndex < categoryOrder.length - 1) {
    const temp = categoryOrder[dragCategoryIndex];
    categoryOrder[dragCategoryIndex] = categoryOrder[dragCategoryIndex + 1];
    categoryOrder[dragCategoryIndex + 1] = temp;
    dragCategoryIndex++;
    startY = currentY;
    save();
    render();
  }

  if (diff < -34 && dragCategoryIndex > 0) {
    const temp = categoryOrder[dragCategoryIndex];
    categoryOrder[dragCategoryIndex] = categoryOrder[dragCategoryIndex - 1];
    categoryOrder[dragCategoryIndex - 1] = temp;
    dragCategoryIndex--;
    startY = currentY;
    save();
    render();
  }
}

function endCategoryDrag() {
  dragCategoryIndex = null;
  document.querySelectorAll(".category-left").forEach(row => row.classList.remove("dragging"));
}

function startDrag(event, index) {
  if (habits[index].type === "bad") return;

  dragIndex = index;
  dragColor = habits[index].color;
  startY = event.touches[0].clientY;

  const row = document.querySelector(`[data-index="${index}"]`);
  if (row) row.classList.add("dragging");
}

function moveDrag(event) {
  event.preventDefault();

  if (dragIndex === null) return;

  const currentY = event.touches[0].clientY;
  const diff = currentY - startY;

  if (diff > 42) {
    moveWithinCategory(1);
    startY = currentY;
  }

  if (diff < -42) {
    moveWithinCategory(-1);
    startY = currentY;
  }
}

function moveWithinCategory(direction) {
  const sameColorIndexes = habits
    .map((habit, index) => ({ habit, index }))
    .filter(item => (item.habit.type || "good") === "good" && item.habit.color === dragColor)
    .map(item => item.index);

  const currentPosition = sameColorIndexes.indexOf(dragIndex);
  const targetPosition = currentPosition + direction;

  if (targetPosition < 0 || targetPosition >= sameColorIndexes.length) return;

  const targetIndex = sameColorIndexes[targetPosition];

  const temp = habits[dragIndex];
  habits[dragIndex] = habits[targetIndex];
  habits[targetIndex] = temp;

  dragIndex = targetIndex;

  save();
  render();

  const row = document.querySelector(`[data-index="${dragIndex}"]`);
  if (row) row.classList.add("dragging");
}

function endDrag() {
  dragIndex = null;
  dragColor = null;

  document.querySelectorAll(".habit-left").forEach(row => {
    row.classList.remove("dragging");
  });
}

function toggleHabit(habitIndex, dateKey) {
  if ((habits[habitIndex].type || "good") !== "good") return;

  if (!habits[habitIndex].done) {
    habits[habitIndex].done = {};
  }

  habits[habitIndex].done[dateKey] = !habits[habitIndex].done[dateKey];

  save();
  render();
}

function setHabitType(type) {
  if (editingIndex !== null) return;

  currentHabitType = type;
  updateHabitTypeUi(false);
}

function updateHabitTypeUi(disabled) {
  const goodBtn = document.getElementById("goodTypeBtn");
  const badBtn = document.getElementById("badTypeBtn");
  const goodFields = document.getElementById("goodFields");
  const badFields = document.getElementById("badFields");

  goodBtn.classList.toggle("active", currentHabitType === "good");
  badBtn.classList.toggle("active", currentHabitType === "bad");
  goodBtn.classList.toggle("disabled", disabled);
  badBtn.classList.toggle("disabled", disabled);

  goodFields.style.display = currentHabitType === "good" ? "block" : "none";
  badFields.style.display = currentHabitType === "bad" ? "block" : "none";

  if (currentHabitType === "bad") {
    if (!document.getElementById("quitDate").value) {
      setQuitDateValue(getTodayKey());
    } else {
      updateQuitCounter();
      renderQuitCalendar();
    }
  } else {
    hideQuitCalendar();
  }
}

function formatDisplayDate(dateKey) {
  const [y, m, d] = dateKey.split("-");
  return `${d}.${m}.${y}`;
}

function setQuitDateValue(dateKey) {
  if (!dateKey || dateKey > getTodayKey()) dateKey = getTodayKey();

  document.getElementById("quitDate").value = dateKey;
  document.getElementById("quitDateDisplay").value = formatDisplayDate(dateKey);

  calendarViewDate = new Date(dateKey + "T00:00:00");
  calendarViewDate.setHours(0, 0, 0, 0);

  updateQuitCounter();
  renderQuitCalendar();
}

function updateQuitCounter() {
  const quitDate = document.getElementById("quitDate");
  const counter = document.getElementById("quitCounter");

  if (!quitDate.value) setQuitDateValue(getTodayKey());
  if (quitDate.value > getTodayKey()) setQuitDateValue(getTodayKey());

  const days = daysSince(quitDate.value);
  counter.textContent = `Вы отказались ${days} ${getDaysText(days)} назад`;
}

function toggleQuitCalendar() {
  const calendar = document.getElementById("quitCalendar");
  calendar.style.display = calendar.style.display === "block" ? "none" : "block";
  renderQuitCalendar();
}

function hideQuitCalendar() {
  document.getElementById("quitCalendar").style.display = "none";
}

function changeCalendarMonth(delta) {
  calendarViewDate.setMonth(calendarViewDate.getMonth() + delta);
  renderQuitCalendar();
}

function renderQuitCalendar() {
  const calendar = document.getElementById("quitCalendar");
  if (!calendar) return;

  const today = new Date(getTodayKey() + "T00:00:00");
  const selectedKey = document.getElementById("quitDate").value || getTodayKey();

  const year = calendarViewDate.getFullYear();
  const month = calendarViewDate.getMonth();
  const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
  const weekdays = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const offset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

  let html = `
    <div class="calendar-head">
      <button type="button" onclick="changeCalendarMonth(-1)">‹</button>
      <div>${monthNames[month]} ${year}</div>
      <button type="button" onclick="changeCalendarMonth(1)">›</button>
    </div>
    <div class="calendar-grid">
  `;

  weekdays.forEach(day => {
    html += `<div class="calendar-weekday">${day}</div>`;
  });

  for (let i = 0; i < offset; i++) {
    html += `<div class="calendar-day empty"></div>`;
  }

  for (let day = 1; day <= lastDay.getDate(); day++) {
    const date = new Date(year, month, day);
    date.setHours(0, 0, 0, 0);
    const key = toDateKey(date);
    const disabled = date > today;
    const selected = key === selectedKey;

    html += `
      <div class="calendar-day ${disabled ? "disabled" : ""} ${selected ? "selected" : ""}"
        ${disabled ? "" : `onclick="setQuitDateValue('${key}'); hideQuitCalendar();"`}>
        ${day}
      </div>
    `;
  }

  html += `</div>`;
  calendar.innerHTML = html;
}

function openModal() {
  editingIndex = null;
  currentHabitType = "good";

  document.getElementById("modalTitle").textContent = "Новая привычка";
  document.getElementById("habitTitle").value = "";
  document.getElementById("habitDescription").value = "";
  updateDescriptionCounter();
  document.getElementById("habitColor").value = "black";
  colorSelect(document.getElementById("habitColor"));
  setQuitDateValue(getTodayKey());
  document.getElementById("deleteButton").style.display = "none";

  updateHabitTypeUi(false);

  document.getElementById("modal").style.display = "flex";
}

function editHabit(index) {
  if (dragIndex !== null) return;

  editingIndex = index;
  currentHabitType = habits[index].type || "good";

  document.getElementById("modalTitle").textContent = "Редактировать привычку";
  document.getElementById("habitTitle").value = habits[index].title;
  document.getElementById("habitDescription").value = habits[index].description || "";
  updateDescriptionCounter();
  document.getElementById("habitColor").value = habits[index].color || "black";
  setQuitDateValue(habits[index].quitDate || getTodayKey());
  colorSelect(document.getElementById("habitColor"));
  document.getElementById("deleteButton").style.display = "block";

  updateHabitTypeUi(true);

  document.getElementById("modal").style.display = "flex";

  setTimeout(() => {
    autoResize(document.getElementById("habitDescription"));
    if (currentHabitType === "bad") updateQuitCounter();
  }, 0);
}

function saveHabit() {
  const title = document.getElementById("habitTitle").value.trim();
  const description = document.getElementById("habitDescription").value.trim().slice(0, 1000);
  const color = document.getElementById("habitColor").value;
  const quitDate = document.getElementById("quitDate").value || getTodayKey();

  if (!title) return;

  if (editingIndex !== null) {
    habits[editingIndex].title = title;
    habits[editingIndex].description = description;

    if ((habits[editingIndex].type || "good") === "good") {
      habits[editingIndex].color = color;
    } else {
      habits[editingIndex].quitDate = quitDate;
    }
  } else {
    if (currentHabitType === "good") {
      habits.push({
        id: Date.now(),
        type: "good",
        title,
        description,
        color,
        done: {}
      });
    } else {
      habits.push({
        id: Date.now(),
        type: "bad",
        title,
        description,
        quitDate
      });
    }
  }

  save();
  closeModal();
  render();
}

function deleteCurrentHabit() {
  if (editingIndex === null) return;

  if (confirm("Удалить привычку?")) {
    habits.splice(editingIndex, 1);
    save();
    closeModal();
    render();
  }
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
  hideQuitCalendar();
  editingIndex = null;
}

function openCategoryModal(colorKey) {
  if (dragCategoryIndex !== null) return;

  editingCategory = colorKey;
  document.getElementById("categoryTitleInput").value = categoryNames[colorKey];
  document.getElementById("categoryModal").style.display = "flex";
}

function saveCategoryName() {
  const value = document.getElementById("categoryTitleInput").value.trim();
  if (!value || !editingCategory) return;

  categoryNames[editingCategory] = value;

  save();
  closeCategoryModal();
  render();
}

function closeCategoryModal() {
  document.getElementById("categoryModal").style.display = "none";
  editingCategory = null;
}

function updateDescriptionCounter() {
  const textarea = document.getElementById("habitDescription");
  if (textarea.value.length > 1000) {
    textarea.value = textarea.value.slice(0, 1000);
  }

  document.getElementById("descriptionCounter").textContent = `${textarea.value.length}/1000`;
  autoResize(textarea);
}

function autoResize(textarea) {
  textarea.style.height = "auto";
  textarea.style.height = textarea.scrollHeight + "px";
}

function colorSelect(select) {
  const colors = {
    black: "#111111",
    red: "#ff3b30",
    green: "#34c759",
    blue: "#007aff"
  };

  select.style.color = colors[select.value] || "#111111";
}

render();
</script>
