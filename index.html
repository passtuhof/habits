<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Привычки</title>
<style>
:root {
  --left-width: 25vw;
  --day-width: 33px;
  --row-height: 44px;
  --gap: 3px;
  --seven-days-width: calc(var(--day-width) * 7 + var(--gap) * 6);
}

* { box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  margin: 0;
  background: #fff;
  color: #111;
}

.app {
  padding: 14px;
  max-width: 620px;
  margin: 0 auto;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

h1 { margin: 0; font-size: 28px; }

button {
  border: none;
  background: #111;
  color: #fff;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 15px;
}

.empty-state {
  display: none;
  font-size: 16px;
  font-weight: 700;
  color: #777;
  padding: 20px 0;
}

.main-section-title {
  font-size: 16px;
  font-weight: 800;
  margin-top: 18px;
  margin-bottom: 10px;
}

.good-title-main {
  display: none;
  padding-bottom: 8px;
  border-bottom: 1px solid #eee;
}

.tracker {
  display: grid;
  grid-template-columns: var(--left-width) var(--seven-days-width);
  gap: 8px;
  overflow: hidden;
}

.corner {
  height: 24px;
  margin-bottom: 0;
}

.left-column {
  min-width: 0;
}

.category-left {
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  border-bottom: 1px solid #eee;
  font-size: 15px;
  font-weight: 400;
  touch-action: none;
}

.category-left.dragging,
.habit-left.dragging,
.bad-habit-row.dragging {
  transform: scale(1.035);
  background: rgba(0,0,0,0.05);
  border-radius: 10px;
  opacity: 0.8;
}

.category-title {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.category-arrow {
  font-size: 12px;
  flex-shrink: 0;
}

.category-spacer {
  height: 34px;
  border-bottom: 1px solid #eee;
}

.habit-left {
  height: var(--row-height);
  display: flex;
  align-items: center;
  border-bottom: 1px solid #eee;
  transition: transform 0.18s ease, background 0.18s ease, opacity 0.18s ease;
}

.name-wrap {
  min-width: 0;
  flex: 1;
  touch-action: none;
}

.habit-name {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.15;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  white-space: normal;
  overflow: hidden;
  text-overflow: ellipsis;
}

.right-scroll {
  width: var(--seven-days-width);
  min-width: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 10px;
}

.right-inner { min-width: max-content; }

.dates-row,
.check-row {
  display: grid;
  grid-template-columns: repeat(var(--days-count), var(--day-width));
  gap: var(--gap);
}

.dates-row {
  height: 24px;
  margin-bottom: 0;
}

.day {
  text-align: center;
  font-size: 10px;
  line-height: 1.1;
  color: #666;
}

.today { color: #111; font-weight: 800; }

.check-row {
  height: var(--row-height);
  align-items: center;
  border-bottom: 1px solid #eee;
}

.cell {
  width: 23px;
  height: 23px;
  border: 1.5px solid var(--habit-color);
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--habit-color);
  font-size: 16px;
  font-weight: 900;
  margin: 0 auto;
}

.cell.done::after { content: "✓"; }

.bad-section {
  margin-top: 16px;
}

.bad-section-title {
  display: none;
  font-size: 16px;
  font-weight: 800;
  margin: 0;
  padding: 0 0 8px 0;
  border-bottom: 1px solid #eee;
}

.bad-habit-row {
  min-height: var(--row-height);
  display: grid;
  grid-template-columns: minmax(0, 1fr) 190px;
  gap: 8px;
  align-items: center;
  border-bottom: 1px solid #eee;
  transition: transform 0.18s ease, background 0.18s ease, opacity 0.18s ease;
}

.bad-habit-name {
  min-width: 0;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.15;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  touch-action: none;
}

.bad-status {
  text-align: right;
  font-size: 12px;
  font-weight: 700;
  color: #111;
  line-height: 1.15;
  white-space: nowrap;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 20;
}

.modal-content {
  background: white;
  padding: 18px;
  border-radius: 18px;
  width: 100%;
  max-width: 360px;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
}

.type-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.type-btn {
  background: #eee;
  color: #111;
  font-weight: 700;
}

.type-btn.active { background: #111; color: #fff; }
.type-btn:disabled { opacity: 0.55; }

input, textarea, select {
  width: 100%;
  max-width: 100%;
  margin-bottom: 12px;
  padding: 12px;
  font-size: 16px;
  border-radius: 12px;
  border: 1px solid #ccc;
  background: #fff;
}

textarea {
  min-height: 74px;
  resize: none;
  overflow: hidden;
}

.description-wrap {
  position: relative;
  margin-bottom: 12px;
}

.description-wrap textarea {
  margin-bottom: 0;
  padding-bottom: 28px;
}

.char-counter {
  position: absolute;
  right: 12px;
  bottom: 8px;
  font-size: 11px;
  font-weight: 700;
  color: #777;
  pointer-events: none;
}

.label {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
}

.quit-date-wrap { position: relative; }
#quitDateDisplay {
  cursor: pointer;
}

.quit-calendar {
  display: block;
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -46%) scale(0.96);
  width: min(320px, calc(100vw - 48px));
  z-index: 60;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 16px;
  padding: 12px;
  box-shadow: 0 14px 34px rgba(0,0,0,0.22);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.32s ease, transform 0.32s ease, visibility 0.32s ease;
}

.quit-calendar.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}

.calendar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  font-weight: 800;
}

.calendar-head button {
  background: #eee;
  color: #111;
  padding: 6px 10px;
  border-radius: 9px;
}

.calendar-head button:disabled { opacity: 0.35; }

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.calendar-weekday {
  text-align: center;
  font-size: 11px;
  font-weight: 800;
  color: #777;
  padding: 4px 0;
}

.calendar-day {
  text-align: center;
  padding: 8px 0;
  border-radius: 9px;
  font-size: 14px;
  background: #f3f3f3;
  color: #111;
}

.calendar-day.selected {
  background: #111;
  color: #fff;
  font-weight: 800;
}

.calendar-day.disabled {
  color: #b7b7b7;
  background: #f7f7f7;
  pointer-events: none;
}

.calendar-day.empty {
  background: transparent;
  pointer-events: none;
}

.refusal-info {
  font-size: 13px;
  font-weight: 700;
  margin: -2px 0 8px;
  color: #111;
}

.violations-row {
  display: none;
  align-items: center;
  gap: 10px;
  margin: 0 0 12px;
  font-size: 13px;
  font-weight: 700;
}

.violation-btn {
  width: 34px;
  height: 34px;
  padding: 0;
  border-radius: 10px;
  background: #111;
  color: #fff;
  font-size: 20px;
  font-weight: 800;
  line-height: 1;
}

.violation-btn:disabled {
  background: #ddd;
  color: #999;
}

.violation-count {
  min-width: 24px;
  text-align: center;
  font-size: 16px;
  font-weight: 800;
}

.buttons {
  display: flex;
  gap: 8px;
}

.buttons button {
  flex: 1;
  padding: 10px 8px;
}

.cancel { background: #ddd; color: #111; }
.delete-in-modal { background: #eee; color: #111; }

#habitColorDisplay { font-weight: 400; cursor: pointer; }
#habitColor option[value="red"] { color: #ff3b30; }
#habitColorDisplay { color: #111111; }
.picker-item {
  text-align: left;
  padding: 11px 12px;
  border-radius: 10px;
  font-size: 15px;
  background: #f3f3f3;
  color: #111;
  margin-bottom: 6px;
}
.picker-item:last-child { margin-bottom: 0; }
.picker-item.add { color: #777; font-weight: 700; }
.picker-title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 10px;
}
#newCategoryColorDisplay {
  cursor: pointer;
  font-weight: 400;
}

@media (max-width: 390px) {
  :root {
    --left-width: 25vw;
    --day-width: 33px;
  }
}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <h1>Привычки</h1>
    <button onclick="openModal()">+</button>
  </div>

  <div id="emptyState" class="empty-state">У вас пока нет привычек</div>
  <div id="goodTitle" class="main-section-title good-title-main">Хорошие привычки</div>

  <div class="tracker" id="goodTracker">
    <div class="left-column">
      <div class="corner"></div>
      <div id="leftList"></div>
    </div>

    <div class="right-scroll" id="rightScroll">
      <div class="right-inner">
        <div class="dates-row" id="datesRow"></div>
        <div id="checksList"></div>
      </div>
    </div>
  </div>

  <div class="bad-section" id="badSection">
    <div class="bad-section-title" id="badSectionTitle">Отказ от плохих привычек</div>
    <div id="badList"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle">Новая привычка</h2>

    <div class="type-switch">
      <button id="goodTypeBtn" class="type-btn active" onclick="setHabitType('good')">Хорошая</button>
      <button id="badTypeBtn" class="type-btn" onclick="setHabitType('bad')">Плохая</button>
    </div>

    <input id="habitTitle" placeholder="Название привычки">

    <div class="description-wrap">
      <textarea id="habitDescription" maxlength="1000" placeholder="Описание привычки" oninput="updateDescriptionCounter()"></textarea>
      <div id="descriptionCounter" class="char-counter">0/1000</div>
    </div>

    <div id="goodFields">
      <div class="label">Категория</div>
      <input id="habitColorDisplay" readonly value="Нет" onclick="openCategoryPicker()">
      <input id="habitColor" type="hidden" value="black">
      <div id="categoryPicker" class="quit-calendar"></div>
    </div>

    <div id="badFields" style="display:none;">
      <div class="label">Дата отказа</div>
      <div class="quit-date-wrap">
        <input id="quitDateDisplay" readonly onclick="toggleQuitCalendar()">
        <input id="quitDate" type="hidden">
        <div id="quitCalendar" class="quit-calendar"></div>
      </div>
      <div class="refusal-info" id="refusalInfo"></div>
      <div class="violations-row" id="violationsRow">
        <span>Нарушения</span>
        <button type="button" class="violation-btn" id="violationMinus" onclick="changeViolations(-1)">−</button>
        <span class="violation-count" id="violationCount">0</span>
        <button type="button" class="violation-btn" onclick="changeViolations(1)">+</button>
      </div>
    </div>

    <div class="buttons">
      <button onclick="saveHabit()">Сохранить</button>
      <button class="cancel" onclick="closeModal()">Отмена</button>
      <button id="deleteButton" class="delete-in-modal" onclick="deleteCurrentHabit()">Удалить</button>
    </div>
  </div>
</div>


<div class="modal" id="newCategoryModal">
  <div class="modal-content">
    <h2>Новая категория</h2>
    <div class="label">Название категории</div>
    <input id="newCategoryName" placeholder="Название категории">
    <div class="label">Цвет категории</div>
    <input id="newCategoryColorDisplay" readonly value="Красный" onclick="openColorPicker()">
    <input id="newCategoryColor" type="hidden" value="red">
    <div id="colorPicker" class="quit-calendar"></div>
    <div class="buttons">
      <button onclick="saveNewCategory()">Сохранить</button>
      <button class="cancel" onclick="closeNewCategoryModal()">Отмена</button>
    </div>
  </div>
</div>

<div class="modal" id="categoryModal">
  <div class="modal-content">
    <h2>Название категории</h2>
    <input id="categoryTitleInput" placeholder="Название категории">
    <div class="buttons">
      <button onclick="saveCategoryName()">Сохранить</button>
      <button class="cancel" onclick="closeCategoryModal()">Отмена</button>
    </div>
  </div>
</div>

<script>
let habits = JSON.parse(localStorage.getItem("habits")) || [];

let categoryNames = JSON.parse(localStorage.getItem("categoryNames")) || {
  black: ""
};


function setSelectedCategory(categoryId) {
  const id = categoryId || "black";
  const hidden = document.getElementById("habitColor");
  const display = document.getElementById("habitColorDisplay");
  const color = getCategoryColor(id);

  if (hidden) hidden.value = id;
  if (display) {
    display.value = id === "black" ? "Нет" : getCategoryName(id);
    display.style.color = color;
    display.style.fontWeight = "400";
  }
}

function openCategoryPicker() {
  const picker = document.getElementById("categoryPicker");
  if (!picker) return;

  let html = `<div class="picker-title">Категория</div>`;

  html += `<div class="picker-item" style="color:#111111" onclick="setSelectedCategory('black'); closeCategoryPicker();">Нет</div>`;

  customCategories.forEach(cat => {
    const color = colorMap[cat.color] || colorMap.black;
    html += `<div class="picker-item" style="color:${color}" onclick="setSelectedCategory('${cat.id}'); closeCategoryPicker();">${cat.name}</div>`;
  });

  html += `<div class="picker-item add" onclick="closeCategoryPicker(); openNewCategoryModal();">➕ Добавить</div>`;

  picker.innerHTML = html;
  picker.classList.add("open");
}

function closeCategoryPicker() {
  const picker = document.getElementById("categoryPicker");
  if (picker) picker.classList.remove("open");
}

function handleCategorySelect() {
  openCategoryPicker();
}

function openNewCategoryModal() {
  document.getElementById("newCategoryName").value = "";
  setSelectedNewCategoryColor("red");
  document.getElementById("newCategoryModal").style.display = "flex";
}

function closeNewCategoryModal() {
  document.getElementById("newCategoryModal").style.display = "none";
  closeColorPicker();
}

function setSelectedNewCategoryColor(colorKey) {
  const display = document.getElementById("newCategoryColorDisplay");
  const hidden = document.getElementById("newCategoryColor");
  const names = {
    red: "Красный",
    blue: "Синий",
    green: "Зелёный",
    yellow: "Жёлтый"
  };

  if (hidden) hidden.value = colorKey;
  if (display) {
    display.value = names[colorKey] || "Красный";
    display.style.color = colorMap[colorKey] || colorMap.red;
    display.style.fontWeight = "400";
  }
}

function openColorPicker() {
  const picker = document.getElementById("colorPicker");
  if (!picker) return;

  picker.innerHTML = `
    <div class="picker-title">Цвет</div>
    <div class="picker-item" style="color:${colorMap.red}" onclick="setSelectedNewCategoryColor('red'); closeColorPicker();">Красный</div>
    <div class="picker-item" style="color:${colorMap.blue}" onclick="setSelectedNewCategoryColor('blue'); closeColorPicker();">Синий</div>
    <div class="picker-item" style="color:${colorMap.green}" onclick="setSelectedNewCategoryColor('green'); closeColorPicker();">Зелёный</div>
    <div class="picker-item" style="color:${colorMap.yellow}" onclick="setSelectedNewCategoryColor('yellow'); closeColorPicker();">Жёлтый</div>
  `;

  picker.classList.add("open");
}

function closeColorPicker() {
  const picker = document.getElementById("colorPicker");
  if (picker) picker.classList.remove("open");
}

function saveNewCategory() {
  const name = document.getElementById("newCategoryName").value.trim();
  const color = document.getElementById("newCategoryColor").value || "red";

  if (!name) return;

  const cat = {
    id: "cat_" + Date.now(),
    name,
    color
  };

  customCategories.push(cat);
  save();
  setSelectedCategory(cat.id);
  closeNewCategoryModal();
  render();
}

render();
</script>
</body>
</html>
